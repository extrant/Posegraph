[project]
name = "posegraph"
version = "0.3.10"
description = "Posegraph backend: image -> 3D human pose -> FFXIV Brio pose"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scipy>=1.13",
    "httpx>=0.27",
    "pillow>=10",
]

[project.optional-dependencies]
# SAM 3D Body 推理所需（torch/torchvision 需另外按 CUDA 版本安装，见 scripts/setup_sam3d.ps1）
sam3d = [
    "pytorch-lightning",
    "yacs",
    "einops",
    "timm",
    "roma",
    "omegaconf",
    "hydra-core",
    "pyrootutils",
    "braceexpand",
    "huggingface_hub",
    "fvcore",
    "trimesh",
    "matplotlib",
    "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"posegraph" = ["version.json"]
"posegraph.retarget" = ["data/*.json"]
