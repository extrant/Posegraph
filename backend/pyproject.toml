[project]
name = "posegraph"
version = "0.6.0"
description = "Posegraph backend: image -> 3D human pose -> FFXIV Brio pose"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scipy>=1.13",
    "httpx>=0.27",
    "pillow>=10",
    "av>=13,<14",   # 录制配音乐（audio.py）；没装时录无声视频
]

[project.optional-dependencies]
# SAM 3D Body 推理所需（torch/torchvision 需另外按 CUDA / ROCm 版本安装，见 scripts/setup_sam3d.ps1）
sam3d = [
    "pytorch-lightning",
    "yacs",
    "einops",
    "timm",
    "roma",
    "omegaconf",
    "hydra-core",
    "pyrootutils",
    "braceexpand",
    "huggingface_hub",
    "fvcore",
    "trimesh",
    "matplotlib",
    "tqdm",
]

# 面捕（face.py，可选）：mediapipe 默认依赖 opencv-contrib-python，和 opencv-python 冲突，
# 所以用 pip install --no-deps mediapipe 再装这里其余几个；模型 face_landmarker.task 放 checkpoints/face/
face = [
    "absl-py",
    "flatbuffers",
]

# 深度（depth.py，合并模式）：MoGe 依赖 numpy>=2 / opencv-python-headless，和本项目的 opencv-python 冲突，
# 用 pip install --no-deps git+https://github.com/microsoft/MoGe.git 加上 MoGe pyproject 里固定版本的 utils3d_moge、pipeline；
# 模型 Ruicheng/moge-2-vitb-normal 的 model.pt 放 checkpoints/moge/

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"posegraph" = ["version.json", "components.json", "data/*.npy"]
"posegraph.retarget" = ["data/*.json"]
